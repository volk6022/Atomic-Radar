services:
  postgres:
    image: postgres:15
    container_name: postgres-radar
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - radar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [radar_network]

  redis:
    image: redis:7-alpine
    container_name: redis-radar
    restart: unless-stopped
    # Очередь переживает перезапуск: без appendonly принятые, но ещё не разобранные
    # события исчезали бы при рестарте контейнера — то есть ровно в тот момент, когда
    # их больше всего.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - radar_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Порт наружу не публикуется намеренно. Опубликованный порт Docker обходит ufw
    # (проброс идёт в цепочке DOCKER, а не в INPUT), и «закрытый фаерволом» Redis
    # оказался бы открыт всему интернету без пароля.
    networks: [radar_network]

  api:
    # build обязателен: без него `docker compose up -d --build` молча поднимает
    # старый образ, и выкатка выглядит успешной, не изменив ни строчки кода.
    build: .
    image: atomic-radar:latest
    container_name: api-radar
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      RADAR_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RADAR_SECRET_KEY: ${RADAR_SECRET_KEY}
      RADAR_ENGAGE_BASE_URL: ${RADAR_ENGAGE_BASE_URL}
      RADAR_ENGAGE_API_KEY: ${RADAR_ENGAGE_API_KEY}
      RADAR_CORS_ORIGINS: ${RADAR_CORS_ORIGINS}
      RADAR_INGEST_TOKEN: ${RADAR_INGEST_TOKEN}
      RADAR_SELF_BASE_URL: ${RADAR_SELF_BASE_URL}
      RADAR_REDIS_URL: redis://redis:6379/0
      # Домашние модели Ивана, проброшенные туннелями tuna. Пустое значение —
      # это «ступень выключена», а не поломка: каскад тогда честно пишет, что L2/L3
      # не запускались, вместо того чтобы пропускать сообщения молча.
      RADAR_EMBED_BASE_URL: ${RADAR_EMBED_BASE_URL:-}
      RADAR_LLM_BASE_URL: ${RADAR_LLM_BASE_URL:-}
      RADAR_LLM_MODEL: ${RADAR_LLM_MODEL:-qwen-local}
      RADAR_DEBUG: "false"
    ports:
      # Только петля. Наружу — исключительно через Caddy по TLS: сервис держит
      # cookie-сессии, открытый порт сделал бы их доступными по http.
      - "127.0.0.1:8104:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [radar_network, engage_vertsanov]

  worker-ingest:
    # Тот же образ, что у API, — иначе воркер и ручка расходятся по коду, и разбор
    # события зависит от того, кто его подобрал. Отличие ровно одно: команда.
    build: .
    image: atomic-radar:latest
    container_name: worker-ingest-radar
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      # И от API — не ради очерёдности запуска, а ради схемы. Таблицы создаёт и
      # доводит миграциями только он (`app/main.py`, `lifespan`); воркер этого не
      # делает и делать не должен — два процесса, накатывающих схему наперегонки,
      # хуже одного. Поднявшись первым на свежей базе, воркер разбирал бы события
      # против несуществующих таблиц, а такие ошибки по нынешнему устройству
      # растворяются в трёх повторах.
      api: {condition: service_healthy}
    command: ["arq", "app.workers.ingest.WorkerSettings"]
    environment:
      RADAR_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RADAR_REDIS_URL: redis://redis:6379/0
      # Ключ подписи воркеру не нужен для работы, но `validate_runtime()` на старте
      # требует его у любого процесса: настройки одни на всех, и процесс, поднятый с
      # половиной окружения, должен падать сразу, а не на первой задаче.
      RADAR_SECRET_KEY: ${RADAR_SECRET_KEY}
      RADAR_ENGAGE_BASE_URL: ${RADAR_ENGAGE_BASE_URL}
      RADAR_ENGAGE_API_KEY: ${RADAR_ENGAGE_API_KEY}
      RADAR_INGEST_TOKEN: ${RADAR_INGEST_TOKEN}
      # Дозапрос следующей страницы бэкфилла уходит из воркера, и адрес возврата
      # вебхука он подставляет сам — без этого цепочка обрывается на второй странице.
      RADAR_SELF_BASE_URL: ${RADAR_SELF_BASE_URL}
      RADAR_EMBED_BASE_URL: ${RADAR_EMBED_BASE_URL:-}
      RADAR_LLM_BASE_URL: ${RADAR_LLM_BASE_URL:-}
      RADAR_LLM_MODEL: ${RADAR_LLM_MODEL:-qwen-local}
      RADAR_DEBUG: "false"
    networks: [radar_network, engage_vertsanov]

  worker-jobs:
    # Тот же образ, та же причина, что у воркера приёма: разойдись код между
    # процессами — и прогон считал бы каскадом не то, что показывает интерфейс.
    build: .
    image: atomic-radar:latest
    # Имя закреплено, и это не косметика. Воркер прогонов на старте помечает
    # прерванными строки в «выполняется» (`app/workers/jobs.py`, `startup`), а такая
    # пометка честна ровно пока исполнитель один: второй, поднявшись рядом, оборвал бы
    # на экране чужую живую работу. `container_name` не даёт поднять реплики
    # (`docker compose up --scale` откажет), то есть закрепляет допущение техникой,
    # а не памятью о нём.
    container_name: worker-jobs-radar
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      # И от API — не ради очерёдности запуска, а ради схемы. Таблицы создаёт и
      # доводит миграциями только он (`app/main.py`, `lifespan`); воркер этого не
      # делает и делать не должен — два процесса, накатывающих схему наперегонки,
      # хуже одного. Поднявшись первым на свежей базе, воркер упал бы на первом же
      # обращении к `runs`, а при `max_tries: 1` повтора у него нет.
      api: {condition: service_healthy}
    command: ["arq", "app.workers.jobs.WorkerSettings"]
    environment:
      RADAR_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RADAR_REDIS_URL: redis://redis:6379/0
      # Ключ подписи воркеру не нужен для работы, но `validate_runtime()` на старте
      # требует его у любого процесса: настройки одни на всех, и процесс, поднятый с
      # половиной окружения, должен падать сразу, а не на первой задаче.
      RADAR_SECRET_KEY: ${RADAR_SECRET_KEY}
      # Ступени каскада — здесь они и работают: пересчёт ходит в bge-m3 и в Qwen.
      # Пустое значение означает «ступень выключена», и прогон честно пишет это в лог
      # вместо того, чтобы молча пропустить сообщения дальше. Разойдись эти адреса с
      # адресами API — интерфейс показывал бы включённой ступень, которой у
      # исполнителя нет.
      RADAR_EMBED_BASE_URL: ${RADAR_EMBED_BASE_URL:-}
      RADAR_LLM_BASE_URL: ${RADAR_LLM_BASE_URL:-}
      RADAR_LLM_MODEL: ${RADAR_LLM_MODEL:-qwen-local}
      RADAR_DEBUG: "false"
    # Сеть Engage не подключается намеренно: прогон в Telegram не ходит. Лишний
    # интерфейс у процесса — это доступ, о котором никто не просил.
    networks: [radar_network]

volumes:
  radar_pgdata:
  radar_redis:

networks:
  radar_network:
    driver: bridge
  # Сеть инстанса Engage vertsanov, поднятого своим compose. Radar подключается
  # к ней вторым интерфейсом, чтобы ходить в gateway по имени контейнера, а не по
  # опубликованному порту: наружу у Engage торчит только петля, и правильно.
  engage_vertsanov:
    external: true
    name: fleet_network-vertsanov
