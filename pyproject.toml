[project]
name = "atomic-radar"
version = "0.1.0"
description = "Atomic Radar — B2B lead generation over Telegram discussion groups"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# В контейнере корень проекта и так рабочая директория, а локально `import app` без
# этого не находится, и все тесты падают на сборе. Ловушка ровно того сорта, из-за
# которой люди перестают гонять тесты на своей машине.
pythonpath = ["."]

[tool.ruff]
line-length = 100
